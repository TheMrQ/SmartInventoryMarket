# Frozen M5 forecasting protocol — CHECKPOINT-005.
# Raw M5 data stays in the Git-ignored data/raw/m5 directory.
dataset: m5_forecasting_accuracy
source_sales_file: sales_train_evaluation.csv

store_id: CA_1
category_id: FOODS
departments:
  - FOODS_1
  - FOODS_2
  - FOODS_3
expected_item_store_series: 1437

forecast_horizon_days: 28
forecast_target: daily_sales_t_plus_1_to_t_plus_28
derived_application_summary_days:
  - 7
  - 14
  - 28

train:
  start_d: d_1
  end_d: d_1885
  start_date: "2011-01-29"
  end_date: "2016-03-27"

validation:
  start_d: d_1886
  end_d: d_1913
  start_date: "2016-03-28"
  end_date: "2016-04-24"

test:
  start_d: d_1914
  end_d: d_1941
  start_date: "2016-04-25"
  end_date: "2016-05-22"

metrics:
  - MAE
  - RMSE
  - WAPE

protocol_rules:
  random_split_allowed: false
  test_tuning_allowed: false
